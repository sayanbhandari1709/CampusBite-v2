<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBite Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h1 class="logo">
            <i class="fa-solid fa-utensils"></i>
            CampusBite
        </h1>

        <p id="portalTitle">Admin Portal</p>
        <p id="portalHint" style="margin-top:-6px; margin-bottom:18px; color:#9ca3af; font-size:14px;">
            Sign in to continue
        </p>

        <div id="roleBadge" style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#1f2937;color:#fff;font-size:14px;margin-bottom:18px;">
            <i class="fa-solid fa-user-shield"></i>
            <span id="roleBadgeText">Admin</span>
        </div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <p id="message"></p>

        <a href="index.html" style="display:inline-block;margin-top:18px;color:#9ca3af;text-decoration:none;">
            ← Back to portal
        </a>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
